experiment_name: baseline

model:
  block_size: 1024
  vocab_size: 50304
  n_layer: 12
  n_head: 12
  n_embd: 768
  init_method: default
  init_distribution: normal

training:
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 715
  max_steps: 19073
  weight_decay: 0.1
  total_batch_size: 524288
  micro_batch_size: 8
  sequence_length: 1024
  log_name: log.txt
  use_compile: false
  eval_interval: 250
  val_loss_steps: 20
  ddp_find_unused_parameters: true

components:
  attention: base
  position_encoding: learned
